<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste do Motor | Auloo</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <style>
        body {
            font-family: 'Poppins', system-ui, sans-serif;
            background: #F0E8D8;
            color: #1A1614;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { font-family: 'Playfair Display', Georgia, serif; color: #5C1A1A; margin-bottom: 1rem; }
        .motor-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #F8F2E4;
            border: 1px solid #B8894A;
            border-radius: 4px;
            padding: 1.5rem;
        }
        .motor-simulador {
            min-height: 240px;
            background: #E5D9C0;
            border: 1px dashed #B8894A;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-size: 1.2rem;
            color: #7A6E5A;
            user-select: none;
        }
        .motor-texto h2 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.3rem;
            color: #5C1A1A;
            margin-bottom: 0.5rem;
        }
        .motor-texto .motor-corpo {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #3D3528;
        }
        .motor-barra {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(184, 137, 74, 0.3);
        }
        .motor-btn {
            padding: 0.6rem 1.2rem;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #5C1A1A;
            background: transparent;
            border: 1px solid #B8894A;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .motor-btn:hover:not(:disabled) { background: #B8894A; color: #F8F2E4; }
        .motor-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .motor-indicador {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-size: 1rem;
            color: #7A6E5A;
        }
        .alvo {
            width: 80px;
            height: 80px;
            background: #B8894A;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .alvo:hover { transform: scale(1.1); }
        .alvo.clicado { background: #2E7D4F; }
    </style>
</head>
<body>

    <h1>Teste do Motor — 3 passos</h1>
    <p style="margin-bottom: 1rem; color: #7A6E5A;">
        Use os botões ou as setas ← → do teclado.
    </p>

    <div id="motor"></div>

    <script src="assets/js/educacao/motor-animacao.js"></script>
    <script>
        /* Simulador de teste: uma bolinha que muda de cor e posição
           dependendo do passo. No passo 2, ela precisa ser clicada
           (requerInteracao: true) para liberar o "Próximo". */

        const alvo = document.createElement('div');
        alvo.className = 'alvo';

        const simulador = {
            criar(container, ctx) {
                container.appendChild(alvo);

                let clicado = false;

                alvo.addEventListener('click', () => {
                    clicado = true;
                    alvo.classList.add('clicado');
                    ctx.interacaoConcluida();
                });

                /* Guarda o listener para remover em destruir() */
                this._onClick = () => { clicado = true; };
                this._clicado = () => clicado;
            },

            aoMudarPasso(indice, passo, ctx) {
                alvo.classList.remove('clicado');
                clicado = false;

                if (indice === 0) {
                    alvo.style.transform = 'translateX(-80px)';
                    alvo.style.background = '#B8894A';
                } else if (indice === 1) {
                    alvo.style.transform = 'translateX(0)';
                    alvo.style.background = '#B8894A';
                } else if (indice === 2) {
                    alvo.style.transform = 'translateX(80px)';
                    alvo.style.background = '#5C1A1A';
                }
            },

            destruir() {
                alvo.remove();
            }
        };

        const passos = [
            {
                titulo: 'Passo 1 — A bolinha à esquerda',
                texto: 'Observe a bolinha. Ela está posicionada à esquerda. Clique em "Próximo" para continuar.',
                requerInteracao: false
            },
            {
                titulo: 'Passo 2 — Clique na bolinha',
                texto: 'Agora a bolinha voltou ao centro. Clique nela para liberar o próximo passo.',
                requerInteracao: true
            },
            {
                titulo: 'Passo 3 — A bolinha à direita',
                texto: 'A bolinha se moveu para a direita e mudou de cor. Fim do teste.',
                requerInteracao: false
            }
        ];

        const motor = Motor.criar(document.getElementById('motor'), {
            passos: passos,
            simulador: simulador,
            aoMudarPasso: (indice) => {
                console.log('Passo atual:', indice);
            }
        });

        window.motor = motor; // para testar no console
    </script>
</body>
</html>
