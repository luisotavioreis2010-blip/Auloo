<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1A1614">
    <title>Escrever | Auloo</title>
    <link rel="icon" type="image/png" href="assets/img/logo/auloo-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/estante.css">
    <link rel="stylesheet" href="assets/css/editor.css">
</head>
<body class="editor-body">

    <header class="editor-topo">
        <div class="editor-topo-esq">
            <a href="comunidade.html" class="btn-voltar">← Sair</a>
            <span class="editor-status" id="editor-status">Rascunho não salvo</span>
        </div>
        
        <div class="editor-toolbar">
            <button type="button" title="Negrito" data-cmd="bold"><b>B</b></button>
            <button type="button" title="Itálico" data-cmd="italic"><i>I</i></button>
            <button type="button" title="Sublinhado" data-cmd="underline"><u>U</u></button>
            <div class="editor-divisor"></div>
            <button type="button" title="Título" data-cmd="formatBlock" data-value="h2">H2</button>
            <button type="button" title="Citação" data-cmd="formatBlock" data-value="blockquote">❝</button>
            <div class="editor-divisor"></div>
            <button type="button" title="Inserir Imagem" id="btn-inserir-img">🖼️</button>
        </div>

        <div class="editor-topo-dir">
            <button type="button" class="btn-publicar" id="btn-publicar">Publicar</button>
        </div>
    </header>

    <main class="editor-main">
        <div class="editor-folha">
            <div class="editor-capa" id="editor-capa" title="Clique para adicionar uma capa">
                <span>Adicionar Capa</span>
            </div>

            <select class="editor-categoria" id="input-categoria">
                <option value="Leituras">Leituras</option>
                <option value="Dúvidas">Dúvidas</option>
                <option value="Vídeos">Vídeos</option>
            </select>

            <input type="text" class="editor-titulo" id="input-titulo" placeholder="Título do artigo..." maxlength="120">

            <div class="editor-conteudo" id="input-conteudo" contenteditable="true" aria-label="Conteúdo do artigo">
                <p>Comece a escrever sua história...</p>
            </div>
        </div>
    </main>

    <input type="file" id="input-img" accept="image/*" hidden>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/lib/utils.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/pages/editor.js"></script>
</body>
</html>
