<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1A1614">
    <title>O Mural | Auloo</title>
    <link rel="icon" type="image/png" href="assets/img/logo/auloo-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/estante.css">
    <link rel="stylesheet" href="assets/css/comunidade.css">
</head>
<body class="mural-body">

    <main class="estante-main main-mural">
        
        <div class="mural-topo">
            <div class="topo-cabecalho">
                <div class="topo-titulo">
                    <h1>O Mural</h1>
                    <p>Pensamentos, descobertas e desafios.</p>
                </div>
                <!-- BOTÃO CORRIGIDO PARA O EDITOR -->
                <a href="editor.html" class="btn-escrever" style="text-decoration: none;">❦ Escrever</a>
            </div>

            <div class="topo-separador"></div>

            <div class="topo-controles">
                <div class="busca-wrapper">
                    <input type="text" placeholder="Buscar canais ou autores...">
                </div>
                <nav class="mural-filtros">
                    <button class="active">Leituras</button>
                    <button>Dúvidas</button>
                    <button>Vídeos</button>
                </nav>
            </div>
        </div>

        <div class="feed">
            <!-- MURAL VAZIO - O JavaScript vai popular isso com os posts reais -->
            <div class="mural-vazio" style="text-align: center; padding: 4rem 0; color: var(--tinta-clara);">
                <p style="font-family: var(--fonte-display); font-size: 1.5rem; font-style: italic;">
                    O Mural está em silêncio... <br>
                    Nenhuma publicação por aqui ainda.
                </p>
                <p style="font-family: var(--fonte-corpo); font-size: 0.85rem; margin-top: 1rem; text-transform: uppercase; letter-spacing: 1px;">
                    Seja o primeiro a <a href="editor.html" style="color: var(--dourado); text-decoration: underline;">escrever para a comunidade</a>.
                </p>
            </div>
        </div>
    </main>

    <!-- Scripts Obrigatórios -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/lib/utils.js"></script>
    <script src="assets/js/layout.js"></script>
</body>
</html>
