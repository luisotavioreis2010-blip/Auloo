<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="description" content="Auloo - Sua plataforma de aprendizado. Faça login para acessar sua conta.">
    <title translate="no">Login | Auloo</title>
    <link rel="icon" type="image/png" href="assets/img/logo/auloo-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="preload" as="fetch" href="assets/img/animacoes/mail-animation.json" crossorigin>
</head>
<body>

    <nav class="navbar-desktop">
        <span class="navbar-logo" translate="no">Auloo<span class="navbar-logo-dot">.</span></span>

        <button type="button" class="menu-hamburger" id="menu-hamburger" aria-label="Abrir menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="menu-dropdown" id="menu-dropdown" hidden>
            <a href="/">Início</a>
            <a href="/#recursos">Saiba mais</a>
            <a href="/privacidade.html">Política de Privacidade</a>
            <a href="/termos.html">Termos de Serviço</a>
        </div>
    </nav>

    <div class="desktop-bg" aria-hidden="true"></div>

    <main class="login-container" id="login-container">
        <section class="login-formulario aberto">
            <form class="form" id="login-form" novalidate>

                <!-- Coluna de login -->
                <div class="form-coluna form-coluna-login">

                    <picture class="ilustracao-login" aria-hidden="true">
                        <source srcset="assets/img/ilustracoes/Dictionary-bro.webp" type="image/webp">
                        <img src="assets/img/ilustracoes/Dictionary-bro.png" alt="" width="600" height="600" decoding="async">
                    </picture>

                    <div id="heading" translate="no">
                        <span class="logo-text">Auloo</span><span class="logo-dot">.</span>
                    </div>

                    <div class="field">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M13.106 7.222c0-2.967-2.249-5.032-5.482-5.032-3.35 0-5.646 2.318-5.646 5.702 0 3.493 2.235 5.708 5.762 5.708.862 0 1.689-.123 2.304-.335v-.862c-.43.199-1.354.328-2.29.328-2.926 0-4.813-1.88-4.813-4.798 0-2.844 1.921-4.881 4.594-4.881 2.735 0 4.608 1.688 4.608 4.156 0 1.682-.554 2.769-1.416 2.769-.492 0-.772-.28-.772-.76V5.206H8.923v.834h-.11c-.266-.595-.881-.964-1.6-.964-1.4 0-2.378 1.162-2.378 2.823 0 1.737.957 2.906 2.379 2.906.8 0 1.415-.39 1.709-1.087h.11c.081.67.703 1.148 1.503 1.148 1.572 0 2.57-1.415 2.57-3.643zm-7.177.704c0-1.197.54-1.907 1.456-1.907.93 0 1.524.738 1.524 1.907S8.308 9.84 7.371 9.84c-.895 0-1.442-.725-1.442-1.914z"></path>
                        </svg>
                        <input placeholder="E-mail" class="input-field" type="email" id="email" name="email" autocomplete="email" aria-label="E-mail" required>
                    </div>

                    <div class="field field-senha">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"></path>
                        </svg>
                        <input placeholder="Senha" class="input-field" type="password" id="senha" name="senha" autocomplete="current-password" aria-label="Senha" required>
                        <button type="button" id="btn-olho" class="btn-olho" aria-label="Mostrar ou ocultar senha">
                            <svg class="olho-aberto" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
                                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                            </svg>
                            <svg class="olho-fechado" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
                                <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z"/>
                                <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z"/>
                                <path d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12-.708.708z"/>
                            </svg>
                        </button>
                    </div>

                    <div class="btn">
                        <button type="button" class="button1" id="btn-login">Login</button>
                        <button type="button" class="button2" id="btn-signup">Sign Up</button>
                    </div>

                    <button type="button" class="button3" id="btn-forgot">Forgot Password</button>
                </div>

                <!-- Coluna de login social -->
                <div class="form-coluna form-coluna-sociais">

                    <div class="divisor-login">
                        <span></span>
                        <span>ou continue com</span>
                        <span></span>
                    </div>

                    <div class="botoes-sociais">
                        <button type="button" class="botao-social" id="btn-google" aria-label="Login com Google">
                            <img src="assets/img/icones/google.gif" width="22" height="22" loading="lazy" alt="">
                        </button>
                        <button type="button" class="botao-social" id="btn-discord" aria-label="Login com Discord">
                            <img src="assets/img/icones/discord.gif" width="22" height="22" loading="lazy" alt="">
                        </button>
                        <button type="button" class="botao-social" id="btn-github" aria-label="Login com GitHub">
                            <img src="assets/img/icones/github.gif" width="22" height="22" loading="lazy" alt="">
                        </button>
                    </div>

                </div>

            </form>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/pages/login.js"></script>
</body>
</html>
