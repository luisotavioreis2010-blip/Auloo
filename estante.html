<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content">
    <meta name="theme-color" content="#1A1614">
    <meta name="description" content="Auloo - Aprenda e compartilhe conhecimento.">
    <title translate="no">Início | Auloo</title>
    <link rel="icon" type="image/png" href="assets/img/logo/auloo-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/estante.css">
</head>
<body>

    <main class="estante-main">
        <div class="ilustracao-container">
            <picture>
                <source srcset="assets/img/ilustracoes/Poetry.webp" type="image/webp">
                <img src="assets/img/ilustracoes/Poetry.webp" alt="Ilustração de estudo" class="ilustracao-central" width="600" height="400" decoding="async" fetchpriority="high">
            </picture>
        </div>

        <div class="calendario-container">
            <div class="calendario">
                <div class="calendario-cabecalho">
                    <button class="calendario-btn" id="btn-mes-anterior" type="button" aria-label="Mês anterior">&#8249;</button>
                    <div class="calendario-titulo-container" aria-live="polite">
                        <span class="calendario-titulo" id="calendario-titulo">&nbsp;</span>
                        <span class="calendario-subtitulo" id="calendario-subtitulo">&nbsp;</span>
                    </div>
                    <button class="calendario-btn" id="btn-proximo-mes" type="button" aria-label="Próximo mês">&#8250;</button>
                </div>
                <div class="calendario-dias-semana">
                    <span class="dia-semana">DOM</span><span class="dia-semana">SEG</span><span class="dia-semana">TER</span>
                    <span class="dia-semana">QUA</span><span class="dia-semana">QUI</span><span class="dia-semana">SEX</span>
                    <span class="dia-semana">SÁB</span>
                </div>
                <div class="calendario-dias" id="calendario-dias"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/lib/utils.js"></script>
    <script src="assets/js/layout.js"></script>
</body>
</html>
