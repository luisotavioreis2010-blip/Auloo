<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1A1614">
    <title>Meu Ateliê | Auloo</title>
    <link rel="icon" type="image/png" href="assets/img/logo/auloo-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/estante.css">
    <link rel="stylesheet" href="assets/css/atelie.css">
</head>
<body>

    <main class="atelie-main">
        <!-- Estado Vazio (Usuário sem ateliê) -->
        <div id="atelie-vazio" class="atelie-vazio" hidden>
            <h2>Seu Ateliê está vazio.</h2>
            <p>Este é o seu espaço de criação. Abra o seu Ateliê para começar a escrever, criar quizzes e publicar no Mural.</p>
            <button id="btn-criar-atelie" class="btn-primario">Abrir Meu Ateliê</button>
        </div>

        <!-- O CARD DO ATELIÊ -->
        <div id="atelie-conteudo" class="atelie-conteudo" hidden>
            <!-- A capa recebe a tag <img> para permitir arrastar e dar zoom -->
            <div class="atelie-capa-wrapper">
                <img id="atelie-capa-img" class="atelie-capa-img" src="" alt="Capa do Ateliê">
            </div>
            
            <div class="atelie-header">
                <div class="atelie-avatar" id="atelie-avatar"></div>
                <div class="atelie-info">
                    <h1 class="atelie-nome" id="atelie-nome">Nome do Ateliê</h1>
                    <!-- O Handle agora é um código único gerado pelo sistema -->
                    <span class="atelie-handle" id="atelie-handle">@auloo-00000</span>
                    <p class="atelie-bio" id="atelie-bio">Bio do ateliê aqui.</p>
                </div>
                <div class="atelie-acoes">
                    <button class="btn-primario" id="btn-configurar-atelie">Configurar Ateliê</button>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DE CRIAÇÃO (Para quem ainda não tem ateliê) -->
    <div id="modal-criar-atelie" class="modal-overlay" hidden>
        <div class="modal-conteudo">
            <header class="modal-header">
                <h2>Forjar seu Ateliê</h2>
                <button type="button" id="btn-fechar-modal" class="modal-fechar">&#10005;</button>
            </header>
            
            <form id="form-criar-atelie">
                <div class="campo">
                    <label for="input-nome-atelie">Nome do Ateliê</label>
                    <input type="text" id="input-nome-atelie" placeholder="Ex: O Ateliê do João" required>
                </div>
                <div class="campo">
                    <label for="input-bio-atelie">Descrição (Bio)</label>
                    <textarea id="input-bio-atelie" placeholder="Amante de exatas e café..." rows="3"></textarea>
                </div>
                <button type="submit" class="btn-primario" id="btn-salvar-atelie" style="width: 100%; margin-top: 1rem;">Criar Ateliê</button>
            </form>
        </div>
    </div>

    <!-- GAVETA LATERAL DE CONFIGURAÇÃO (Estilo Ficha do Aluno) -->
    <div class="gaveta-overlay-config" id="overlay-config"></div>
    
    <aside class="atelie-gaveta" id="gaveta-config">
        <header class="atelie-gaveta-header">
            <h2>Configurar Ateliê</h2>
            <button type="button" class="atelie-gaveta-fechar" id="btn-fechar-config">&#10005;</button>
        </header>

        <div class="atelie-gaveta-corpo">
            <form id="form-config-atelie">
                <div class="campo">
                    <label for="input-config-nome">Nome do Ateliê</label>
                    <input type="text" id="input-config-nome" required>
                </div>
                <!-- Campo @ removido da edição, pois é gerado pelo sistema -->
                <div class="campo">
                    <label for="input-config-bio">Descrição (Bio)</label>
                    <textarea id="input-config-bio" rows="3"></textarea>
                </div>
                
                <div class="campo-upload">
                    <label>Avatar do Ateliê</label>
                    <button type="button" class="btn-container" id="btn-upload-avatar">Escolher Imagem de Perfil</button>
                    <input type="file" id="input-config-avatar" accept="image/*" hidden>
                </div>

                <div class="campo-upload">
                    <label>Capa do Ateliê</label>
                    <small style="display:block; margin-bottom: 0.5rem; color: var(--tinta-clara); font-size: 0.7rem;">
                        * Arraste para mover e use a roda do mouse para dar zoom.
                    </small>
                    
                    <div id="capa-preview-container" class="capa-preview-container" style="display: none;">
                        <div id="capa-preview-arrastavel" class="capa-preview-arrastavel"></div>
                    </div>

                    <button type="button" class="btn-container" id="btn-upload-capa" style="margin-top: 0.5rem;">Escolher Nova Imagem de Capa</button>
                    <input type="file" id="input-config-capa" accept="image/*" hidden>
                </div>

                <button type="submit" class="btn-primario" id="btn-salvar-config" style="width: 100%; margin-top: 1rem;">Salvar Alterações</button>
            </form>
        </div>
    </aside>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/lib/utils.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/pages/atelie.js"></script>
</body>
</html>
