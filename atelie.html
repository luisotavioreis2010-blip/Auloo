<!-- GAVETA LATERAL INTELIGENTE (substitui o bloco <aside class="atelie-gaveta"> inteiro)
     Todos os IDs usados pelo atelie.js foram mantidos. -->
<div class="gaveta-overlay-config" id="overlay-config"></div>
<aside class="atelie-gaveta" id="gaveta-config">

    <!-- Painel do Canal -->
    <div id="config-canal" class="config-painel ativo">
        <header class="atelie-gaveta-header">
            <div class="gaveta-titulo-bloco">
                <span class="gaveta-eyebrow">Seu espaço</span>
                <h2>Configurar Ateliê</h2>
            </div>
            <button type="button" class="atelie-gaveta-fechar" id="btn-fechar-config" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </header>

        <div class="atelie-gaveta-corpo">
            <form id="form-config-atelie">

                <section class="gaveta-secao">
                    <h3 class="gaveta-secao-titulo"><span class="romano">I</span>Identidade</h3>
                    <div class="campo">
                        <label for="input-config-nome">Nome do Ateliê</label>
                        <input type="text" id="input-config-nome" maxlength="60" required>
                    </div>
                    <div class="campo">
                        <label for="input-config-bio">Descrição (Bio)</label>
                        <textarea id="input-config-bio" rows="3" maxlength="200" placeholder="Conte em poucas palavras o que você cria..."></textarea>
                    </div>
                </section>

                <section class="gaveta-secao">
                    <h3 class="gaveta-secao-titulo"><span class="romano">II</span>Avatar</h3>
                    <div class="avatar-linha">
                        <div id="avatar-preview-container" class="avatar-preview-container" title="Arraste para ajustar">
                            <div id="avatar-preview-arrastavel" class="avatar-preview-arrastavel">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                        </div>
                        <div class="avatar-acoes">
                            <p class="gaveta-dica">Arraste a imagem para enquadrar o rosto.</p>
                            <button type="button" class="btn-container" id="btn-upload-avatar">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                Escolher imagem
                            </button>
                        </div>
                        <input type="file" id="input-config-avatar" accept="image/*" hidden>
                    </div>
                </section>

                <section class="gaveta-secao">
                    <h3 class="gaveta-secao-titulo"><span class="romano">III</span>Capa</h3>
                    <div id="capa-preview-container" class="capa-preview-container" style="display: none;">
                        <div id="capa-preview-arrastavel" class="capa-preview-arrastavel"></div>
                    </div>
                    <div class="capa-vazia">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                        Nenhuma capa ainda
                    </div>
                    <button type="button" class="btn-container" id="btn-upload-capa">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        Escolher imagem de capa
                    </button>
                    <input type="file" id="input-config-capa" accept="image/*" hidden>
                </section>

                <div class="gaveta-rodape">
                    <button type="submit" id="btn-salvar-config">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Painel da Redação -->
    <div id="config-redacao" class="config-painel" hidden>
        <header class="atelie-gaveta-header">
            <div class="gaveta-titulo-bloco">
                <span class="gaveta-eyebrow">Redação</span>
                <h2>Opções do Artigo</h2>
            </div>
            <button type="button" class="atelie-gaveta-fechar" id="btn-fechar-config-redacao" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </header>
        <div class="atelie-gaveta-corpo">
            <div class="campo-upload">
                <label>Imagem de Capa do Artigo</label>
                <div id="capa-artigo-preview" class="capa-preview-container" style="display: none;">
                    <div id="capa-artigo-arrastavel" class="capa-preview-arrastavel"></div>
                </div>
                <button type="button" class="btn-container" id="btn-upload-capa-artigo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Escolher imagem de capa
                </button>
                <input type="file" id="input-capa-artigo" accept="image/*" hidden>
            </div>
            <div class="campo">
                <label for="input-categoria-artigo">Categoria</label>
                <select id="input-categoria-artigo" class="select-custom">
                    <option value="Matemática">Matemática</option>
                    <option value="Ciências">Ciências</option>
                    <option value="Redação & Literatura">Redação & Literatura</option>
                    <option value="História & Geografia">História & Geografia</option>
                    <option value="Dicas de Estudo">Dicas de Estudo</option>
                </select>
            </div>
            <button type="button" class="btn-descartar" id="btn-descartar-rascunho">Descartar Rascunho</button>
        </div>
    </div>
</aside>
